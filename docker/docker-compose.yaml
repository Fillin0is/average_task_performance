name: average-task-performance

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jira}
      POSTGRES_USER: ${POSTGRES_USER:-jira}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jira_dev_password}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - jira_internal

  jira:
    image: atlassian/jira-software:11.3
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${JIRA_PORT:-8080}:8080"
    environment:
      ATL_JDBC_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-jira}
      ATL_JDBC_USER: ${POSTGRES_USER:-jira}
      ATL_JDBC_PASSWORD: ${POSTGRES_PASSWORD:-jira_dev_password}
      ATL_DB_DRIVER: org.postgresql.Driver
      ATL_DB_TYPE: postgres72
      JVM_MINIMUM_MEMORY: ${JIRA_JVM_MINIMUM_MEMORY:-512m}
      JVM_MAXIMUM_MEMORY: ${JIRA_JVM_MAXIMUM_MEMORY:-2g}
      TZ: ${TZ:-Europe/Moscow}
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --show-error http://localhost:8080/status >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 30
      start_period: 180s
    volumes:
      - jira_data:/var/atlassian/application-data/jira
    networks:
      - jira_internal

volumes:
  jira_data:
  postgres_data:

networks:
  jira_internal:
    driver: bridge
