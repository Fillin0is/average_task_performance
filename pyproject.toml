[project]
name = "average-task-performance"
version = "0.1.0"
description = "Experiments for predicting software issue resolution time with TAWOS"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.116",
    "ipykernel>=7.3.0",
    "joblib>=1.5",
    "jupyterlab>=4.6.2",
    "matplotlib>=3.11.1",
    "pandas>=3.0.5",
    "pymysql[rsa]>=1.2.0",
    "pytest>=8.4",
    "scikit-learn>=1.7",
    "sqlalchemy>=2.0.51",
    "uvicorn>=0.52",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["api*", "data_access*"]
